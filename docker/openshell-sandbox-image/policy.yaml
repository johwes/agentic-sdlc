# Default sandbox network / filesystem policy
# Minimal valid policy for base image build - replace with
# dev-sandbox-policy.yaml from openshell-community for production.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox

landlock:
  compatibility: best_effort
