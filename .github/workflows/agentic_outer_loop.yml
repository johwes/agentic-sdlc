name: Agentic SDLC Outer Loop (EDD Governance)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  outer-loop-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Extract PR Git Diff (Semantic Delta Input)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          else
            git diff HEAD~1...HEAD > pr.diff || touch pr.diff
          fi

      - name: Isolate Verification Suite Against Base Branch (Anti-Tampering)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            echo "🛡️ CI Anti-Tampering: Overwriting PR tests with base branch tests from $BASE_REF..."
            git checkout "$BASE_REF" -- tests/ || echo "Warning: Base branch tests checkout skipped"
          fi

      - name: Execute Deterministic Verification Tests (Inner Loop Gate)
        id: test_gate
        run: |
          python -m pytest tests/ -v
        continue-on-error: true

      - name: Execute Outer Loop Evaluation Judge
        id: eval_judge
        run: |
          TESTS_PASSED_FLAG=""
          if [ "${{ steps.test_gate.outcome }}" = "success" ]; then
            TESTS_PASSED_FLAG="--tests-passed"
          fi

          ALLOW_TESTS_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ALLOW_TESTS_FLAG="--allow-test-changes"
          fi

          asdlc eval \
            --spec spec.md \
            --diff pr.diff \
            --out release-evidence.json \
            --task-id "PR-${{ github.event.pull_request.number || github.sha }}" \
            --sha "${{ github.sha }}" \
            --target-rev "${{ github.base_ref || 'main' }}" \
            --risk-class "Low" \
            $TESTS_PASSED_FLAG \
            $ALLOW_TESTS_FLAG

      - name: Upload Release Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence.json

      - name: Emit GitHub Step Summary
        run: |
          echo "## 🛡️ Agentic SDLC Release Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat release-evidence.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Enforce Gate Verdict
        run: |
          VERDICT=$(python -c "import json; print(json.load(open('release-evidence.json'))['gate_verdict'])")
          echo "Gate Verdict: $VERDICT"
          if [ "$VERDICT" = "REJECTED" ]; then
            echo "❌ Gate Rejected: Verification tests failed or spec violated."
            exit 1
          fi

  deploy-presentation:
    needs: outer-loop-governance
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

